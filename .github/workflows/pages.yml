name: GitHub Pages publish check

on:
  push:
    branches:
      - main

jobs:
  publish-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm GitHub Pages source
        run: |
          echo "GitHub Pages is configured to publish directly from the main branch."
          echo "No gh-pages branch deployment is required for this repository."
